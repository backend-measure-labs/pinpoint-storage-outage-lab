# 핀포인트 저장소 2.5.3: ZooKeeper · HBase. 공식 pinpoint-docker 구성에서 web 과 ZooKeeper 2대를 뺐다.
apiVersion: v1
kind: Namespace
metadata:
  name: pinpoint-lab
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: zoo1, namespace: pinpoint-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: zoo1}}
  template:
    metadata: {labels: {app: zoo1}}
    spec:
      containers:
        - name: zookeeper
          image: zookeeper:3.4.13
          ports: [{containerPort: 2181}]
---
apiVersion: v1
kind: Service
metadata: {name: zoo1, namespace: pinpoint-lab}
spec:
  selector: {app: zoo1}
  ports: [{name: client, port: 2181}]
---
# 이미지의 hbase-site.xml 은 ZooKeeper 3대(zoo1,zoo2,zoo3)를 가리킨다. 1대로 줄인 판으로 덮는다.
apiVersion: v1
kind: ConfigMap
metadata: {name: hbase-site, namespace: pinpoint-lab}
data:
  hbase-site.xml: |
    <configuration>
      <property><name>hbase.rootdir</name><value>file:///home/pinpoint/hbase</value></property>
      <property><name>hbase.cluster.distributed</name><value>true</value></property>
      <property><name>zookeeper.znode.parent</name><value>/hbase</value></property>
      <property><name>hbase.zookeeper.quorum</name><value>zoo1</value></property>
      <property><name>hbase.zookeeper.property.clientPort</name><value>2181</value></property>
      <property><name>hbase.master.port</name><value>60000</value></property>
      <property><name>hbase.regionserver.port</name><value>60020</value></property>
    </configuration>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pinpoint-hbase, namespace: pinpoint-lab}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: pinpoint-hbase}}
  template:
    metadata: {labels: {app: pinpoint-hbase}}
    spec:
      # 리전 서버는 자기 호스트 이름을 ZooKeeper 에 올리고 컬렉터는 그 이름으로 붙는다. 서비스 이름과 맞춘다.
      hostname: pinpoint-hbase
      # ZooKeeper 보다 먼저 뜨면 마스터가 기본 znode 를 만들지 못하고 죽는다
      initContainers:
        - name: wait-zookeeper
          image: busybox:1.36
          # 기동 중인 ZooKeeper 는 연결을 받고 응답하지 않을 수 있어 nc -w 로는 끊기지 않는다. nc 를 timeout 으로 직접 감싼다.
          command: [sh, -c, 'until [ "$(echo ruok | timeout 3 nc zoo1 2181)" = imok ]; do sleep 1; done']
      containers:
        - name: hbase
          image: pinpointdocker/pinpoint-hbase:2.5.3
          ports:
            - {containerPort: 60000}
            - {containerPort: 60020}
          volumeMounts:
            - {name: hbase-site, mountPath: /opt/hbase/hbase-1.2.6/conf/hbase-site.xml, subPath: hbase-site.xml}
      volumes:
        - name: hbase-site
          configMap: {name: hbase-site}
---
apiVersion: v1
kind: Service
metadata: {name: pinpoint-hbase, namespace: pinpoint-lab}
spec:
  clusterIP: None
  selector: {app: pinpoint-hbase}
  ports:
    - {name: master, port: 60000}
    - {name: regionserver, port: 60020}
