# 고정 도착률 부하. 응답이 늦어져도 초당 요청 수가 줄지 않으므로 앱 쪽에 요청이 쌓이는지가 그대로 드러난다.
apiVersion: v1
kind: ConfigMap
metadata: {name: k6-script, namespace: pinpoint-lab}
data:
  load.js: |
    import http from 'k6/http';
    export const options = {
      discardResponseBodies: true,
      scenarios: {
        steady: {
          executor: 'constant-arrival-rate',
          rate: Number(__ENV.RATE || 50), timeUnit: '1s',
          duration: __ENV.DURATION || '6h',
          preAllocatedVUs: 50, maxVUs: 400,
        },
      },
    };
    export default function () {
      http.get(`http://outage-lab-app:8080/orders/${Math.floor(Math.random() * 100000)}`, { timeout: '10s', tags: { name: 'orders' } });
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: k6, namespace: pinpoint-lab}
spec:
  replicas: 0
  selector: {matchLabels: {app: k6}}
  template:
    metadata: {labels: {app: k6}}
    spec:
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args: [run, --quiet, /scripts/load.js]
          env:
            - {name: RATE, value: "50"}
          volumeMounts: [{name: script, mountPath: /scripts}]
      volumes:
        - name: script
          configMap: {name: k6-script}
