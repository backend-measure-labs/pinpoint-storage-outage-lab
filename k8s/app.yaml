# 에이전트를 붙인 앱. 운영 조건: request 메모리 1Gi · limit 없음 (QoS Burstable). CPU 값은 기록이 없어 두지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata: {name: outage-lab-app, namespace: pinpoint-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: outage-lab-app}}
  template:
    metadata: {labels: {app: outage-lab-app}}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: outage-lab-app:local
          imagePullPolicy: Never
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: AGENT, value: "on"}
          ports: [{containerPort: 8080}]
          resources:
            requests: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /stock/1, port: 8080}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: outage-lab-app, namespace: pinpoint-lab}
spec:
  selector: {app: outage-lab-app}
  ports: [{port: 8080}]
